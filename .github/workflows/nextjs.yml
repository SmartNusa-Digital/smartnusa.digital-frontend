name: 🚀 Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "production"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"

jobs:
  # ─── Detect Package Manager ───────────────────────────────────────────────
  detect:
    name: 🔍 Detect Package Manager
    runs-on: ubuntu-latest
    outputs:
      manager: ${{ steps.detect.outputs.manager }}
      install_cmd: ${{ steps.detect.outputs.install_cmd }}
      run_cmd: ${{ steps.detect.outputs.run_cmd }}
      lockfile: ${{ steps.detect.outputs.lockfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect
        run: |
          if [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
            echo "manager=bun"         >> $GITHUB_OUTPUT
            echo "install_cmd=install" >> $GITHUB_OUTPUT
            echo "run_cmd=bunx --bun"  >> $GITHUB_OUTPUT
            echo "lockfile=bun.lockb"  >> $GITHUB_OUTPUT
            echo "✅ Detected: Bun"
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn"        >> $GITHUB_OUTPUT
            echo "install_cmd=install" >> $GITHUB_OUTPUT
            echo "run_cmd=yarn"        >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock"  >> $GITHUB_OUTPUT
            echo "✅ Detected: Yarn"
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm"        >> $GITHUB_OUTPUT
            echo "install_cmd=install" >> $GITHUB_OUTPUT
            echo "run_cmd=pnpm"        >> $GITHUB_OUTPUT
            echo "lockfile=pnpm-lock.yaml" >> $GITHUB_OUTPUT
            echo "✅ Detected: pnpm"
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm"         >> $GITHUB_OUTPUT
            echo "install_cmd=ci"      >> $GITHUB_OUTPUT
            echo "run_cmd=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
            echo "✅ Detected: npm"
          else
            echo "❌ No lockfile found. Please commit your lockfile."
            exit 1
          fi

  # ─── Lint & Type Check ────────────────────────────────────────────────────
  quality:
    name: 🧹 Lint & Type Check
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: needs.detect.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        if: needs.detect.outputs.manager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.detect.outputs.manager }}

      - name: Install dependencies
        run: ${{ needs.detect.outputs.manager }} ${{ needs.detect.outputs.install_cmd }}

      - name: Run ESLint
        run: |
          if grep -q '"lint"' package.json; then
            ${{ needs.detect.outputs.manager }} run lint
          else
            ${{ needs.detect.outputs.run_cmd }} next lint --dir app
          fi

      - name: Run TypeScript check
        run: |
          if [ -f "tsconfig.json" ]; then
            ${{ needs.detect.outputs.run_cmd }} tsc --noEmit
          else
            echo "⚠️ No tsconfig.json found, skipping TypeScript check..."
          fi

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [detect, quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: needs.detect.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        if: needs.detect.outputs.manager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.detect.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ needs.detect.outputs.manager }}-nextjs-${{ hashFiles(needs.detect.outputs.lockfile) }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-${{ needs.detect.outputs.manager }}-nextjs-${{ hashFiles(needs.detect.outputs.lockfile) }}-
            ${{ runner.os }}-${{ needs.detect.outputs.manager }}-nextjs-

      - name: Install dependencies
        run: ${{ needs.detect.outputs.manager }} ${{ needs.detect.outputs.install_cmd }}

      - name: Build Next.js
        run: ${{ needs.detect.outputs.run_cmd }} next build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Report build size
        run: |
          echo "📦 Build output size:"
          du -sh ./out
          echo ""
          echo "📁 Top-level files:"
          ls -lah ./out

  # ─── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Manager:** ${{ needs.detect.outputs.manager }}" >> $GITHUB_STEP_SUMMARY
